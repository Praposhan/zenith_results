<style>
  :root {
    --navy-deep: #060E1C; --navy: #0B1B33;
    --gold: #C9A24B; --gold-soft: #E4CD8E;
    --ink: #FFFFFF; --sub: #AEB8CC; --card: #101F3B; --border: #24365C;
  }
  * { box-sizing: border-box; }
  body { margin:0; background: var(--navy-deep); color: var(--ink); font-family:'DM Sans',sans-serif; line-height:1.6; }
  .wrap { max-width: 760px; margin: 0 auto; padding: 60px 24px 80px; }
  .nav { display:flex; justify-content:space-between; align-items:center; margin-bottom:56px; font-size:13px; }
  .nav a { color: var(--sub); text-decoration:none; margin-left:20px; }
  .nav a:hover { color: var(--gold); }
  .nav-cta { display:inline-block; background: var(--gold); color: var(--navy-deep) !important; padding:9px 18px; border-radius:999px; font-weight:700; font-size:12.5px; animation: navPulse 2.2s infinite; }
  @keyframes navPulse { 0% { box-shadow: 0 0 0 0 rgba(201,162,75,0.55); } 70% { box-shadow: 0 0 0 9px rgba(201,162,75,0); } 100% { box-shadow: 0 0 0 0 rgba(201,162,75,0); } }
  .brand { color: var(--gold); font-weight:700; letter-spacing:2px; font-size:12px; text-transform:uppercase; }
  .kicker { color: var(--gold); font-size:12px; font-weight:700; letter-spacing:2px; text-transform:uppercase; margin-bottom:12px; }
  h1 { font-family:'Syne',sans-serif; font-weight:800; font-size:34px; margin:0 0 40px; }
  .post-card { display:block; background: var(--card); border:1px solid var(--border); border-radius:14px; padding:22px; margin-bottom:16px; text-decoration:none; color: inherit; }
  .post-card:hover { border-color: var(--gold); }
  .post-type { display:inline-block; font-size:10.5px; font-weight:700; letter-spacing:1px; text-transform:uppercase; color: var(--gold); background: rgba(201,162,75,0.12); padding:3px 10px; border-radius:999px; margin-bottom:10px; }
  .post-title { font-family:'Syne',sans-serif; font-weight:700; font-size:19px; margin-bottom:6px; }
  .post-date { font-size:12px; color:#5A6784; margin-bottom:10px; }
  .post-excerpt { font-size:14px; color: var(--sub); }
  .empty-note { color: var(--sub); font-size:14px; }
  footer { margin-top:60px; padding-top:24px; border-top:1px solid var(--border); font-size:12px; color:#5A6784; text-align:center; }

  @media (max-width: 640px) {
    .nav { flex-wrap: wrap; gap: 10px; padding: 14px 16px; justify-content: center; text-align: center; }
    .nav > div { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; width: 100%; justify-content: center; }
    .nav a { margin-left: 0; font-size: 12.5px; }
    .nav-cta { order: 99; width: 100%; text-align: center; }
  }
</style>

<div class="wrap">
  <div class="nav">
    <a href="index.html" style="display:flex; align-items:center; gap:8px; text-decoration:none;"><img src="icon.svg" alt="Praposhan" style="width:28px; height:28px;"><span class="brand">Praposhan</span></a>
    <div>
      <a href="index.html">Home</a>

      <a class="nav-cta" href="https://praposhan.github.io/zenith_results/zenith-quiz.html">Take ZENITH Quiz Now →</a>
    </div>
  </div>

  <div class="kicker">Insights</div>
  <h1>The Praposhan Blog</h1>

  <div style="background: var(--card); border:1.5px solid var(--gold); border-radius:14px; padding:22px 24px; margin-bottom:40px;">
    <div style="font-family:'Syne',sans-serif; font-weight:700; font-size:17px; margin-bottom:6px;">Get the next one first</div>
    <div style="color: var(--sub); font-size:13.5px; margin-bottom:14px;">New research-backed articles, straight to your inbox — no spam, unsubscribe anytime.</div>
    <div style="display:flex; gap:8px; flex-wrap:wrap;">
      <input type="email" id="newsletter-email" placeholder="Your email address" style="flex:1; min-width:200px; background: var(--navy-deep); border:1.5px solid var(--border); color:#fff; padding:12px 14px; border-radius:8px; font-family:'DM Sans',sans-serif; font-size:14px;">
      <button id="newsletter-submit" style="background: var(--gold); color: var(--navy-deep); border:none; padding:12px 22px; border-radius:8px; font-weight:700; font-size:13.5px; cursor:pointer;">Subscribe</button>
    </div>
    <div id="newsletter-status" style="font-size:12.5px; margin-top:8px; min-height:14px;"></div>
  </div>

  <div id="post-list"></div>

  <footer>Praposhan — Sleep to Rise</footer>
</div>

<script>
  // ===================================================================
  // TO ADD A NEW POST: add one entry to this array, then re-upload this
  // file to GitHub. Newest posts should go at the TOP of the list.
  //
  //   type: "Article", "Video", or "Guide" — shown as the small tag
  //   title: the post's headline
  //   date: e.g. "March 2027"
  //   excerpt: one or two sentences, shown on this index page
  //   link: the filename of the post's own page (see blog-post-template.html)
  //         — for a video, this can be a YouTube link directly instead
  // ===================================================================
  const POSTS = [
    { type: "Article", title: "Your Brain on No Sleep: What Decades of Research Actually Show", date: "2026", excerpt: "What a 2010 meta-analysis of 70 studies found happens to attention, memory, and judgment after short-term sleep loss.", link: "brain-on-no-sleep.html" },
    { type: "Article", title: "Snoring Isn't Just Annoying — Here's What the Research Says It's Connected To", date: "2026", excerpt: "A landmark JAMA study and the cardiometabolic research that followed it.", link: "snoring-not-just-annoying.html" },
    { type: "Article", title: "The Insomnia Treatment More Effective Than Pills (That Almost Nobody Uses)", date: "2026", excerpt: "Why CBT-I is the first-line treatment guidelines recommend — and what it does for mental health too.", link: "cbt-i-vs-pills.html" },
    { type: "Article", title: "The Two-Way Street Between Sleep and Mental Health", date: "2026", excerpt: "Evidence that improving sleep quality actively improves mental health outcomes, not just the reverse.", link: "two-way-street-mental-health.html" },
    { type: "Article", title: "The 8.8-Hour Rule Nobody Told You About Your Coffee Habit", date: "2026", excerpt: "A 2023 meta-analysis pinpointed exactly when your last coffee should be.", link: "caffeine-cutoff-rule.html" },
    { type: "Article", title: "The Nightcap Myth: What Alcohol Actually Does to Your Sleep", date: "2026", excerpt: "Falling asleep faster isn't the same as sleeping well — here's the REM data.", link: "nightcap-myth.html" },
    { type: "Article", title: "The Overlooked Risk Factor Sitting in Your Evening Glass of Wine", date: "2026", excerpt: "The measurable link between alcohol and sleep apnea risk.", link: "overlooked-risk-evening-glass.html" },
    { type: "Article", title: "Your Phone Is Quietly Editing Your Bedtime", date: "2026", excerpt: "The exact mechanism by which screens delay your body's melatonin release.", link: "phone-editing-bedtime.html" },
    { type: "Article", title: "Why You Can't Cram Your Way to Remembering Anything", date: "2026", excerpt: "Sleep before AND after learning both matter for memory — here's why.", link: "cant-cram-memory.html" },
    { type: "Article", title: "Move More, Sleep Better: What the Data Actually Says About Timing", date: "2026", excerpt: "The evidence on evening workouts is more forgiving than the folklore.", link: "move-more-sleep-better.html" },
    { type: "Article", title: "Sleep Is Doing More for Your Immune System Than You Think", date: "2026", excerpt: "A rhinovirus experiment that measured sleep's effect on catching a cold.", link: "immune-system-sleep.html" },
    { type: "Article", title: "The Quiet Metabolic Cost of Short Sleep", date: "2026", excerpt: "The overlooked link between sleep and insulin resistance.", link: "metabolic-cost-short-sleep.html" },
    { type: "Article", title: "The Science-Backed Case for a Midday Nap at Work", date: "2026", excerpt: "What the research says about nap timing, duration, and cognitive payoff.", link: "case-for-midday-nap.html" },
    { type: "Article", title: "Are You Really a 'Night Owl,' or Is That Just an Excuse?", date: "2026", excerpt: "What chronotype research actually supports — and what it doesn't.", link: "night-owl-excuse.html" },
    { type: "Article", title: "Why 'Catching Up' on Sleep This Weekend Might Be Working Against You", date: "2026", excerpt: "The term 'social jetlag,' and the dose-dependent research behind it.", link: "catching-up-working-against-you.html" },
  ];

  const NEWSLETTER_URL = 'https://script.google.com/macros/s/AKfycbzYmVyEqOMn4P66AaIl57hzWnCiYv08IY_gErJDM7qwYu6XkWyx3w8ycJbvgZGVHjM7/exec';
  const EMAIL_RE = /^[a-zA-Z0-9.!#$%&'*+/=?^_`{|}~-]+@[a-zA-Z0-9](?:[a-zA-Z0-9-]{0,61}[a-zA-Z0-9])?(?:\.[a-zA-Z0-9](?:[a-zA-Z0-9-]{0,61}[a-zA-Z0-9])?)+$/;
  document.getElementById('newsletter-submit').addEventListener('click', () => {
    const emailInput = document.getElementById('newsletter-email');
    const status = document.getElementById('newsletter-status');
    const email = emailInput.value.trim().toLowerCase();
    if (!EMAIL_RE.test(email)) {
      status.style.color = '#D0654A';
      status.textContent = 'Enter a valid email address.';
      return;
    }
    fetch(NEWSLETTER_URL, {
      method: 'POST', mode: 'no-cors',
      body: JSON.stringify({ action: 'newsletter_signup', email })
    }).catch(() => {});
    status.style.color = '#4CAF7D';
    status.textContent = "You're in — watch your inbox.";
    emailInput.value = '';
  });

  const container = document.getElementById('post-list');
  if (POSTS.length === 0) {
    container.innerHTML = '<p class="empty-note">New posts are on their way — check back soon.</p>';
  } else {
    container.innerHTML = POSTS.map(p => `
      <a class="post-card" href="${p.link}" target="${p.link.startsWith('http') ? '_blank' : '_self'}">
        <span class="post-type">${p.type}</span>
        <div class="post-title">${p.title}</div>
        <div class="post-date">${p.date} · By Geethika Babu</div>
        <div class="post-excerpt">${p.excerpt}</div>
      </a>
    `).join('');
  }
</script>

<!-- ===== FAQ Chat Widget ===== -->
<style>
  #faq-bubble { position:fixed; bottom:22px; right:22px; width:58px; height:58px; border-radius:50%; background: var(--gold); display:flex; align-items:center; justify-content:center; cursor:pointer; box-shadow:0 4px 18px rgba(0,0,0,0.4); z-index:999; }
  #faq-bubble svg { width:26px; height:26px; }
  #faq-panel { position:fixed; bottom:90px; right:22px; width:320px; max-width:calc(100vw - 40px); max-height:70vh; overflow-y:auto; background: var(--navy, #0B1B33); border:1.5px solid var(--gold); border-radius:16px; padding:20px; display:none; z-index:999; box-shadow:0 8px 30px rgba(0,0,0,0.5); }
  #faq-panel.open { display:block; }
  #faq-panel .faq-title { font-family:'Syne',sans-serif; font-weight:700; font-size:16px; color:#fff; margin-bottom:14px; }
  .faq-q { display:block; width:100%; text-align:left; background: rgba(255,255,255,0.05); border:1px solid var(--border, #24365C); color:#fff; padding:11px 14px; border-radius:10px; font-size:13px; margin-bottom:8px; cursor:pointer; font-family:'DM Sans',sans-serif; }
  .faq-q:hover { border-color: var(--gold); }
  .faq-a { background: rgba(201,162,75,0.1); border-left:3px solid var(--gold); padding:12px 14px; border-radius:8px; font-size:12.5px; color:#C7CEDC; margin: -4px 0 10px; line-height:1.5; display:none; }
  .faq-a.open { display:block; }
  .faq-fallback { display:block; text-align:center; background:#25D366; color:#063d1f; text-decoration:none; padding:11px; border-radius:10px; font-weight:700; font-size:12.5px; margin-top:12px; }
</style>

<div id="faq-bubble" onclick="document.getElementById('faq-panel').classList.toggle('open')">
  <svg viewBox="0 0 24 24" fill="#060E1C"><path d="M12 2C6.48 2 2 6.48 2 12c0 1.54.36 3 .97 4.29L2 22l5.71-.97C9 21.64 10.46 22 12 22c5.52 0 10-4.48 10-10S17.52 2 12 2zm0 18c-1.36 0-2.65-.32-3.79-.88l-.27-.13-2.83.48.48-2.83-.13-.27C4.32 14.65 4 13.36 4 12c0-4.41 3.59-8 8-8s8 3.59 8 8-3.59 8-8 8z"/><circle cx="8" cy="12" r="1.2"/><circle cx="12" cy="12" r="1.2"/><circle cx="16" cy="12" r="1.2"/></svg>
</div>

<div id="faq-panel">
  <div class="faq-title">Quick Questions</div>
  <div id="faq-list"></div>
  <a class="faq-fallback" href="https://chat.whatsapp.com/LUxqnVDfm7QLZYiS2V3HfN" target="_blank">Still stuck? Ask us on WhatsApp</a>
</div>

<script>
  const FAQS = [
    { q: "What is Praposhan?", a: "Praposhan is a sleep and performance coaching company founded by Geethika Babu, combining clinical sleep science with real coaching — not generic wellness advice." },
    { q: "What is the ZENITH Assessment?", a: "A free, 5-minute <a href='https://praposhan.github.io/zenith_results/zenith-quiz.html' style='color:var(--gold);'>assessment</a> across your sleep, daily habits, and recovery. It's the starting point for everyone — takes the guesswork out of which program actually fits you." },
    { q: "What programs do you offer?", a: "ZENITH Reset (self-paced), the Sleep to Rise Program (full 1:1 coaching), and two specialized pathways — Calm to Rise (mental health support) and Breath to Rise (breathing & lifestyle support) — for those whose ZENITH results call for it." },
    { q: "How much does it cost?", a: "Pricing depends on which program actually fits your results — the fastest way to get a real number is to take the free ZENITH Assessment or message us directly on WhatsApp." },
    { q: "How do I join the free community?", a: "Tap the WhatsApp button on our Programs page — it's free for our first 200 members." },
  ];
  const list = document.getElementById('faq-list');
  list.innerHTML = FAQS.map((f, i) => `
    <button class="faq-q" onclick="document.getElementById('faq-a-${i}').classList.toggle('open')">${f.q}</button>
    <div class="faq-a" id="faq-a-${i}">${f.a}</div>
  `).join('');
</script>

</body>
