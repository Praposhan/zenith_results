<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Your ZENITH Score | Praposhan</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@600;700;800&family=Manrope:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --navy-deep: #0e1220;
    --navy-mid: #171c30;
    --gold: #c9a24a;
    --gold-soft: #e3c98a;
    --gold-dim: #7a6636;
    --cream: #f3ede0;
    --muted: #9aa0b4;
    --line: rgba(201, 162, 74, 0.18);
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--navy-deep);
    color: var(--cream);
    font-family: 'Manrope', sans-serif;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    padding: 48px 20px 80px;
  }

  @media (prefers-reduced-motion: reduce) {
    * { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; }
  }

  .page { width: 100%; max-width: 640px; }

  .eyebrow {
    font-size: 12px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--gold);
    text-align: center;
    margin-bottom: 10px;
    font-weight: 600;
  }

  h1.brand {
    font-family: 'Syne', sans-serif;
    font-weight: 800;
    font-size: clamp(26px, 5vw, 34px);
    text-align: center;
    margin: 0 0 4px;
    letter-spacing: -0.01em;
  }

  .tagline {
    text-align: center;
    color: var(--muted);
    font-size: 14px;
    margin-bottom: 44px;
    font-style: italic;
  }

  .greeting {
    text-align: center;
    font-size: 16px;
    color: var(--cream);
    margin-bottom: 6px;
  }

  .greeting strong { color: var(--gold-soft); }

  /* Sunrise gauge — signature element */
  .gauge-wrap {
    position: relative;
    width: 260px;
    height: 260px;
    margin: 28px auto 8px;
  }

  svg.gauge { width: 100%; height: 100%; transform: rotate(-90deg); }

  .gauge-track {
    fill: none;
    stroke: rgba(255,255,255,0.06);
    stroke-width: 14;
  }

  .gauge-fill {
    fill: none;
    stroke: url(#riseGradient);
    stroke-width: 14;
    stroke-linecap: round;
    stroke-dasharray: 691.15;
    stroke-dashoffset: 691.15;
    animation: rise 1.6s cubic-bezier(0.22, 1, 0.36, 1) forwards;
    animation-delay: 0.3s;
  }

  .gauge-center {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
  }

  .score-num {
    font-family: 'Syne', sans-serif;
    font-weight: 800;
    font-size: 56px;
    line-height: 1;
    color: var(--gold-soft);
    opacity: 0;
    animation: fadeUp 0.8s ease forwards;
    animation-delay: 1.4s;
  }

  .score-max {
    font-size: 13px;
    color: var(--muted);
    margin-top: 4px;
    letter-spacing: 0.05em;
  }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(6px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .band-label {
    text-align: center;
    font-family: 'Syne', sans-serif;
    font-weight: 700;
    font-size: 18px;
    color: var(--gold);
    margin: 14px 0 2px;
    opacity: 0;
    animation: fadeUp 0.8s ease forwards;
    animation-delay: 1.6s;
  }

  .band-sub {
    text-align: center;
    font-size: 13.5px;
    color: var(--muted);
    max-width: 420px;
    margin: 0 auto 40px;
    opacity: 0;
    animation: fadeUp 0.8s ease forwards;
    animation-delay: 1.7s;
  }

  /* Layer breakdown */
  .layers { margin-top: 8px; }

  .layer-row {
    margin-bottom: 22px;
  }

  .layer-head {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    margin-bottom: 8px;
  }

  .layer-name {
    font-size: 13.5px;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    color: var(--cream);
    font-weight: 600;
  }

  .layer-score {
    font-family: 'Syne', sans-serif;
    font-weight: 700;
    font-size: 15px;
    color: var(--gold-soft);
  }

  .layer-track {
    height: 8px;
    border-radius: 6px;
    background: rgba(255,255,255,0.06);
    overflow: hidden;
  }

  .layer-fill {
    height: 100%;
    border-radius: 6px;
    width: 0%;
    background: linear-gradient(90deg, var(--gold-dim), var(--gold));
    transition: width 1.2s cubic-bezier(0.22, 1, 0.36, 1);
  }

  .note {
    margin-top: 48px;
    padding: 22px 24px;
    border: 1px solid var(--line);
    border-radius: 10px;
    background: var(--navy-mid);
  }

  .note-title {
    font-family: 'Syne', sans-serif;
    font-weight: 700;
    font-size: 15px;
    color: var(--gold-soft);
    margin-bottom: 8px;
  }

  .note-body {
    font-size: 13.5px;
    line-height: 1.6;
    color: var(--muted);
  }

  .footer {
    text-align: center;
    margin-top: 40px;
    font-size: 12px;
    color: var(--muted);
    letter-spacing: 0.04em;
  }

  .empty-state {
    text-align: center;
    color: var(--muted);
    font-size: 14px;
    padding: 60px 20px;
  }
</style>
</head>
<body>
  <div class="page" id="app">
    <!-- populated by JS -->
  </div>

<script>
  const params = new URLSearchParams(window.location.search);

  const name = params.get('name') || '';
  const score = params.has('score') ? Number(params.get('score')) : null;
  const sleep = params.has('sleep') ? Number(params.get('sleep')) : null;
  const lifestyle = params.has('lifestyle') ? Number(params.get('lifestyle')) : null;
  const recovery = params.has('recovery') ? Number(params.get('recovery')) : null;

  const app = document.getElementById('app');

  function band(score) {
    if (score >= 80) return { label: 'Optimized', sub: 'Your architecture and inputs are aligned. The focus now is holding this under real-world stress.' };
    if (score >= 60) return { label: 'Building Capacity', sub: 'The foundation is there. A few targeted shifts in sleep architecture or lifestyle load will move this meaningfully.' };
    if (score >= 40) return { label: 'Fragmented Recovery', sub: 'Your system is compensating, not recovering. This is exactly the range the 6-week protocol is built for.' };
    return { label: 'Depleted', sub: 'Recovery debt has likely been accumulating for a while. This is a strong starting point to work from, not a verdict.' };
  }

  function clampPct(v) {
    if (v === null || isNaN(v)) return 0;
    return Math.max(0, Math.min(100, v));
  }

  if (score === null || isNaN(score)) {
    app.innerHTML = `
      <div class="eyebrow">Praposhan</div>
      <h1 class="brand">ZENITH Score</h1>
      <div class="empty-state">No score found in the link. Please use the results link sent to your email after completing the assessment.</div>
    `;
  } else {
    const pct = clampPct(score);
    const circumference = 691.15; // 2 * PI * r, r = 110
    const offset = circumference - (circumference * pct / 100);
    const b = band(pct);

    app.innerHTML = `
      <div class="eyebrow">Praposhan</div>
      <h1 class="brand">Sleep to Rise.</h1>
      <div class="tagline">Your ZENITH Score results</div>

      ${name ? `<div class="greeting">Hi <strong>${name}</strong>, here's where you stand today.</div>` : ''}

      <div class="gauge-wrap">
        <svg class="gauge" viewBox="0 0 240 240">
          <defs>
            <linearGradient id="riseGradient" x1="0%" y1="100%" x2="100%" y2="0%">
              <stop offset="0%" stop-color="#7a6636" />
              <stop offset="55%" stop-color="#c9a24a" />
              <stop offset="100%" stop-color="#f3d98a" />
            </linearGradient>
          </defs>
          <circle class="gauge-track" cx="120" cy="120" r="110" />
          <circle class="gauge-fill" cx="120" cy="120" r="110"
                  style="stroke-dashoffset: ${offset};" />
        </svg>
        <div class="gauge-center">
          <div class="score-num">${pct}</div>
          <div class="score-max">OUT OF 100</div>
        </div>
      </div>

      <div class="band-label">${b.label}</div>
      <div class="band-sub">${b.sub}</div>

      <div class="layers">
        ${sleep !== null ? `
        <div class="layer-row">
          <div class="layer-head">
            <span class="layer-name">Sleep Architecture</span>
            <span class="layer-score">${clampPct(sleep)}</span>
          </div>
          <div class="layer-track"><div class="layer-fill" data-w="${clampPct(sleep)}"></div></div>
        </div>` : ''}

        ${lifestyle !== null ? `
        <div class="layer-row">
          <div class="layer-head">
            <span class="layer-name">Lifestyle Inputs</span>
            <span class="layer-score">${clampPct(lifestyle)}</span>
          </div>
          <div class="layer-track"><div class="layer-fill" data-w="${clampPct(lifestyle)}"></div></div>
        </div>` : ''}

        ${recovery !== null ? `
        <div class="layer-row">
          <div class="layer-head">
            <span class="layer-name">Recovery / Performance Output</span>
            <span class="layer-score">${clampPct(recovery)}</span>
          </div>
          <div class="layer-track"><div class="layer-fill" data-w="${clampPct(recovery)}"></div></div>
        </div>` : ''}
      </div>

      <div class="note">
        <div class="note-title">What happens next</div>
        <div class="note-body">
          This score is a starting snapshot, not a diagnosis. Reply to the email you received this link in,
          and we'll walk through what's driving your score and whether the 6-week protocol is the right fit.
        </div>
      </div>

      <div class="footer">PRAPOSHAN &middot; SLEEP TO RISE</div>
    `;

    // trigger bar fill animations after paint
    requestAnimationFrame(() => {
      document.querySelectorAll('.layer-fill').forEach(el => {
        const w = el.getAttribute('data-w');
        setTimeout(() => { el.style.width = w + '%'; }, 100);
      });
    });
  }
</script>
</body>
</html>
